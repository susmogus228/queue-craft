[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "queuecraft"
version = "0.1.0"
description = "A local learned-dispatch scheduling comparison workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2,<3", "scikit-learn>=1.6,<2", "ortools>=9.12,<10",
  "joblib>=1.4,<2", "threadpoolctl>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
report = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["queuecraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

